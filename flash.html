<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angel Line — Flash</title>
<meta name="description" content="An ink table. Draw once, and the symmetry turns it into something holy.">
<meta name="theme-color" content="#ecebe6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ecebe6'/%3E%3Cpath d='M32 6v52M16 22h32' stroke='%230b0b0c' stroke-width='3'/%3E%3Ccircle cx='32' cy='22' r='5' fill='%23c3141b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Grenze+Gotisch:wght@400;600;800&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/flash.css">
</head>
<body class="paper flash">
<canvas id="paper" class="layer" aria-hidden="true"></canvas>
<canvas id="ink" class="layer" role="img" aria-label="Ink drawing surface. Draw with the pointer; every stroke is mirrored into a symmetrical gothic ornament."></canvas>

<aside class="f-tools panel light" aria-label="Ink tools">
  <p class="panel-title"><span>Room N-04</span><b id="f-count">0 strokes</b></p>
  <p class="jp">刺青</p>
  <h1 class="display">Flash</h1>
  <p class="f-desc">Draw anywhere on the paper. Every line is mirrored until it turns into a sigil.</p>

  <div class="f-group" role="radiogroup" aria-label="Symmetry">
    <span class="k">Symmetry</span>
    <div class="f-row">
      <button class="chip" role="radio" data-sym="2" aria-checked="false">Mirror</button>
      <button class="chip" role="radio" data-sym="4" aria-checked="false">×4</button>
      <button class="chip" role="radio" data-sym="6" aria-checked="true">×6</button>
      <button class="chip" role="radio" data-sym="8" aria-checked="false">×8</button>
    </div>
  </div>
  <div class="f-group" role="radiogroup" aria-label="Brush">
    <span class="k">Brush</span>
    <div class="f-row">
      <button class="chip" role="radio" data-brush="ink" aria-checked="true">Ink</button>
      <button class="chip" role="radio" data-brush="thorn" aria-checked="false">Thorn</button>
      <button class="chip" role="radio" data-brush="chain" aria-checked="false">Chain</button>
      <button class="chip" role="radio" data-brush="blood" aria-checked="false">Blood</button>
    </div>
  </div>
  <div class="f-actions">
    <button class="btn" id="f-bless">Bless it</button>
    <button class="btn ghost" id="f-undo">Undo</button>
    <button class="btn ghost" id="f-clear">Clear</button>
    <button class="btn ghost" id="f-save">Download</button>
  </div>
  <p class="f-hint">Bless it draws a new ornament for you. <kbd>Z</kbd> undo · <kbd>C</kbd> clear</p>
</aside>
<script type="module" src="js/flash.js"></script>
</body>
</html>
